<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Thème 22 : Feux obligatoires et facultatifs du véhicule</title>
<style>
  :root {
    --primary:#1a56db;--success:#057a55;--danger:#c81e1e;
    --bg:#f9fafb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  header{text-align:center;margin-bottom:32px;max-width:700px;width:100%;}
  .badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:10px;}
  h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;}
  header p{color:var(--muted);font-size:.95rem;}
  .progress-wrap{max-width:700px;width:100%;margin-bottom:20px;}
  .progress-info{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px;}
  .progress-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 32px;max-width:700px;width:100%;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .question-num{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:10px;}
  .question-text{font-size:1.1rem;font-weight:600;line-height:1.5;margin-bottom:20px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
    border:2px solid var(--border);border-radius:10px;cursor:pointer;
    transition:border-color .15s,background .15s;font-size:.97rem;line-height:1.4;user-select:none;}
  .choice:hover:not(.disabled){border-color:var(--primary);background:#eff6ff;}
  .choice-letter{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg);
    border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.82rem;transition:background .15s,border-color .15s,color .15s;}
  .choice.correct{border-color:var(--success);background:#f0fdf4;}
  .choice.correct .choice-letter{background:var(--success);border-color:var(--success);color:#fff;}
  .choice.wrong{border-color:var(--danger);background:#fef2f2;}
  .choice.wrong .choice-letter{background:var(--danger);border-color:var(--danger);color:#fff;}
  .choice.disabled{cursor:default;}
  .explanation{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:.92rem;
    line-height:1.5;display:none;}
  .explanation.ok{background:#f0fdf4;border-left:4px solid var(--success);color:#065f46;}
  .explanation.ko{background:#fef2f2;border-left:4px solid var(--danger);color:#7f1d1d;}
  .btn-next{margin-top:22px;width:100%;padding:14px;background:var(--primary);color:#fff;
    border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;display:none;
    transition:background .15s;}
  .btn-next:hover{background:#1e40af;}
  #results{display:none;text-align:center;}
  .score-circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;margin:0 auto 24px;font-size:2.2rem;font-weight:800;
    border:8px solid var(--primary);color:var(--primary);}
  .score-circle small{font-size:.85rem;font-weight:500;color:var(--muted);}
  #results h2{font-size:1.4rem;margin-bottom:8px;}
  #results > p{color:var(--muted);margin-bottom:24px;}
  .recap{text-align:left;margin-top:16px;border-top:1px solid var(--border);}
  .recap-item{display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:.88rem;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.ok{background:var(--success);}
  .dot.ko{background:var(--danger);}
  .btn-restart{margin-top:28px;padding:14px 32px;background:var(--primary);color:#fff;
    border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;
    transition:background .15s;}
  .btn-restart:hover{background:#1e40af;}
</style>
</head>
<body>

<header>
  <div class="badge">Formation ECSR</div>
  <h1>Thème 22 — Feux obligatoires et facultatifs du véhicule</h1>
  <p>15 questions · Sélectionne une réponse pour valider · v2</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 15</span>
    <span id="score-label">Score : 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="card">
  <div id="quiz">
    <div class="question-num" id="q-num">Question 1</div>
    <div class="question-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
    <div class="explanation" id="explanation"></div>
    <button class="btn-next" id="btn-next" type="button">Question suivante →</button>
  </div>

  <div id="results">
    <div class="score-circle"><span id="r-score"></span><small id="r-pct"></small></div>
    <h2 id="r-mention"></h2>
    <p id="r-desc"></p>
    <div class="recap" id="recap"></div>
    <button class="btn-restart" id="btn-restart" type="button">🔄 Recommencer</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Quelle est la portée des feux de croisement (codes) ?",
    choices: ["15 mètres","30 mètres","100 mètres","150 mètres"],
    answer: 1,
    exp: "Les feux de croisement ont une portée d'environ 30 mètres. Leur faisceau est court et plongeant pour ne pas éblouir les usagers venant en sens inverse."
  },
  {
    q: "Quelle est la portée minimale des feux de route (plein phares) ?",
    choices: ["30 mètres","50 mètres","100 mètres","200 mètres"],
    answer: 2,
    exp: "Les feux de route doivent éclairer à au moins 100 mètres. Leur faisceau long et puissant est réservé aux routes non éclairées sans véhicule à proximité."
  },
  {
    q: "Quel voyant s'allume au tableau de bord lorsque les feux de route sont activés ?",
    choices: ["Un voyant vert","Un voyant orange","Un voyant bleu","Un voyant rouge"],
    answer: 2,
    exp: "Le témoin des feux de route est bleu. Le vert correspond aux feux de brouillard avant, et l'orange aux feux de brouillard arrière."
  },
  {
    q: "Dans quelle situation les feux de brouillard arrière sont-ils autorisés ?",
    choices: ["Lors de toute pluie, même légère","Par brouillard ou chute de neige uniquement","De nuit, quelle que soit la visibilité","Lors d'un stationnement sur la voie publique"],
    answer: 1,
    exp: "Les feux de brouillard arrière ne peuvent être utilisés que par brouillard ou chute de neige. Leur usage sous la pluie est interdit car leur puissance éblouit le conducteur suiveur et masque les feux stop."
  },
  {
    q: "Quand doit-on passer des feux de route aux feux de croisement ?",
    choices: ["Dès que l'on approche d'une agglomération éclairée","Seulement si le véhicule en face fait un appel de phares","Dès qu'un véhicule susceptible d'être ébloui est perceptible","Uniquement en cas de brouillard"],
    answer: 2,
    exp: "Il faut passer aux feux de croisement dès qu'un véhicule susceptible d'être ébloui est perceptible, qu'il vienne en sens inverse ou qu'il précède. Ne pas attendre d'être trop proche."
  },
  {
    q: "Les feux de jour (DRL) sont obligatoires sur les voitures particulières neuves depuis :",
    choices: ["1er janvier 2000","7 février 2011","1er janvier 2015","7 août 2012"],
    answer: 1,
    exp: "Les feux de jour (DRL) sont obligatoires sur les voitures particulières neuves depuis le 7 février 2011 (utilitaires légers depuis le 7 août 2012), conformément à la directive européenne 2008/89/CE."
  },
  {
    q: "Un véhicule équipé de feux de jour (DRL) roule de nuit. Que doit faire le conducteur ?",
    choices: ["Rien, les DRL suffisent pour être vu","Activer manuellement les feux de croisement","Activer uniquement les feux de position","Utiliser les feux de route dès la tombée de la nuit"],
    answer: 1,
    exp: "Les DRL n'éclairent qu'à l'avant et ne remplacent pas les feux de croisement. La nuit ou par mauvaise visibilité, il faut impérativement allumer les feux de croisement manuellement car l'arrière du véhicule reste sinon invisible."
  },
  {
    q: "Le faisceau des feux de croisement est asymétrique. Comment éclaire-t-il ? (2 bonnes réponses — choisissez la plus complète)",
    choices: ["Plus large à gauche et plus loin à droite","Plus large à droite et plus loin à gauche","Identique des deux côtés, mais court","Plus large à gauche uniquement"],
    answer: 0,
    exp: "Le faisceau de croisement est asymétrique par conception : il éclaire plus LARGE à gauche (pour voir les bords de chaussée) et plus LOIN à droite (le faisceau monte davantage côté droit pour voir les panneaux). La coupure nette est à gauche pour ne pas éblouir les véhicules venant en sens inverse."
  },
  {
    q: "L'oubli du clignotant lors d'un changement de direction est sanctionné par :",
    choices: ["Une amende de 4ème classe (135 €) sans retrait de points","Une amende de 3ème classe (68 €) et 1 point retiré","Une amende de 2ème classe (35 €) et 3 points retirés","Une simple mise en garde sans amende"],
    answer: 2,
    exp: "L'oubli du clignotant est une contravention de 2ème classe : amende forfaitaire de 35 € (22 € minorée, 75 € majorée) et retrait de 3 points sur le permis. C'est une infraction plus légère que le défaut d'éclairage (4ème classe, 4 points) mais elle retire quand même des points."
  },
  {
    q: "À quelle distance minimale la plaque d'immatriculation arrière doit-elle être lisible de nuit ?",
    choices: ["10 mètres","20 mètres","30 mètres","50 mètres"],
    answer: 1,
    exp: "L'éclairage de la plaque arrière doit la rendre lisible à 20 mètres de nuit. Il s'allume automatiquement en même temps que les feux de position."
  },
  {
    q: "Les feux de détresse (warnings) peuvent être utilisés dans laquelle de ces situations ?",
    choices: ["Pour se garer rapidement devant une boulangerie","Pour signaler un ralentissement brutal sur autoroute","Pour remplacer les clignotants lors d'un changement de file","Pour signaler qu'on va dépasser un autre véhicule"],
    answer: 1,
    exp: "Les warnings signalent un danger immédiat : véhicule immobilisé sur la chaussée, ralentissement brutal sur autoroute, véhicule remorqué. Ils ne légitiment pas un arrêt en zone interdite et ne remplacent jamais les clignotants."
  },
  {
    q: "Lors du remplacement d'une ampoule halogène, pourquoi ne faut-il pas toucher le verre avec les doigts nus ?",
    choices: ["Pour éviter les coupures sur le verre fragile","La graisse des doigts crée un point de chaleur qui réduit la durée de vie de l'ampoule","Pour des raisons d'hygiène uniquement","Cela n'a aucune importance pour une ampoule standard"],
    answer: 1,
    exp: "La graisse naturelle des doigts, déposée sur le verre d'une ampoule halogène, crée un point de surchauffe localisé lors de l'allumage. Cela fragilise le verre et peut provoquer l'éclatement ou réduire significativement la durée de vie de l'ampoule. Toujours manipuler avec un chiffon propre ou des gants."
  },
  {
    q: "Quel risque majeur présente l'oubli d'allumer les feux de croisement la nuit sur un véhicule équipé de DRL ?",
    choices: ["Le moteur surchauffe","L'avant du véhicule n'est pas éclairé","L'arrière du véhicule reste invisible pour les autres conducteurs","Les clignotants ne fonctionnent plus correctement"],
    answer: 2,
    exp: "Les DRL n'allument que les feux avant. L'arrière du véhicule reste entièrement éteint, ce qui le rend invisible pour les conducteurs suiveurs — risque majeur de collision arrière."
  },
  {
    q: "Quel est le nombre de points retirés pour avoir circulé de nuit sans les feux réglementaires ?",
    choices: ["0 point (amende uniquement)","2 points","3 points","4 points"],
    answer: 3,
    exp: "Circuler de nuit ou par visibilité insuffisante sans éclairage réglementaire entraîne un retrait de 4 points sur le permis de conduire, en plus de l'amende forfaitaire de 4ème classe (135 €)."
  },
  {
    q: "Dans laquelle de ces situations les feux de route DOIVENT-ILS être éteints ?",
    choices: ["Sur route nationale hors agglomération sans autre véhicule visible","Lorsqu'on dépasse un véhicule circulant dans le même sens","En cas de pluie intense","À l'approche d'un péage autoroutier"],
    answer: 1,
    exp: "Lors d'un dépassement, les feux de route éblouissent le conducteur dépassé via ses rétroviseurs. Il faut donc repasser en feux de croisement dès que la distance avec le véhicule le rend nécessaire. Ils doivent aussi être éteints à l'approche d'un véhicule en sens inverse."
  }
];

let current = 0, score = 0, answered = [];
const letters = ['A','B','C','D'];

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = 'Question ' + (current + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-label').textContent = 'Question ' + (current + 1) + ' / ' + questions.length;
  document.getElementById('score-label').textContent = 'Score : ' + score;
  document.getElementById('progress-fill').style.width = ((current / questions.length) * 100) + '%';

  const choicesEl = document.getElementById('choices');
  choicesEl.textContent = '';
  q.choices.forEach(function(text, i) {
    const div = document.createElement('div');
    div.className = 'choice';

    const letter = document.createElement('div');
    letter.className = 'choice-letter';
    letter.textContent = letters[i];

    const span = document.createElement('span');
    span.textContent = text;

    div.appendChild(letter);
    div.appendChild(span);
    div.addEventListener('click', function() { selectAnswer(i); });
    choicesEl.appendChild(div);
  });

  const exp = document.getElementById('explanation');
  exp.style.display = 'none';
  exp.className = 'explanation';
  exp.textContent = '';

  const btn = document.getElementById('btn-next');
  btn.style.display = 'none';
  btn.textContent = current < questions.length - 1 ? 'Question suivante →' : 'Voir les résultats →';
}

function selectAnswer(idx) {
  const q = questions[current];
  const allChoices = document.querySelectorAll('.choice');
  allChoices.forEach(function(c) { c.classList.add('disabled'); c.style.pointerEvents = 'none'; });

  const correct = q.answer === idx;
  if (correct) score++;
  answered.push({ correct: correct, qText: q.q });

  allChoices[q.answer].classList.add('correct');
  if (!correct) allChoices[idx].classList.add('wrong');

  const exp = document.getElementById('explanation');
  exp.className = 'explanation ' + (correct ? 'ok' : 'ko');
  exp.textContent = (correct ? '✅ Bonne réponse ! ' : '❌ Mauvaise réponse. La bonne réponse était ' + letters[q.answer] + '. ' + q.choices[q.answer] + '. ') + q.exp;
  exp.style.display = 'block';

  document.getElementById('score-label').textContent = 'Score : ' + score;
  document.getElementById('btn-next').style.display = 'block';
}

document.getElementById('btn-next').addEventListener('click', function() {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = 'Terminé !';
  document.getElementById('score-label').textContent = 'Score : ' + score;

  document.getElementById('quiz').style.display = 'none';

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('r-score').textContent = score + '/' + questions.length;
  document.getElementById('r-pct').textContent = pct + ' %';
  document.getElementById('r-mention').textContent = pct >= 80 ? '🎉 Excellent !' : pct >= 60 ? '👍 Bien !' : '📚 À retravailler';
  document.getElementById('r-desc').textContent = 'Tu as obtenu ' + score + ' bonne' + (score > 1 ? 's' : '') + ' réponse' + (score > 1 ? 's' : '') + ' sur ' + questions.length + ' questions.';

  const recap = document.getElementById('recap');
  recap.textContent = '';
  answered.forEach(function(a, i) {
    const item = document.createElement('div');
    item.className = 'recap-item';

    const dot = document.createElement('div');
    dot.className = 'dot ' + (a.correct ? 'ok' : 'ko');

    const label = document.createElement('span');
    const short = a.qText.length > 72 ? a.qText.substring(0, 72) + '…' : a.qText;
    label.textContent = 'Q' + (i + 1) + '. ' + short;

    item.appendChild(dot);
    item.appendChild(label);
    recap.appendChild(item);
  });

  document.getElementById('results').style.display = 'block';
}

document.getElementById('btn-restart').addEventListener('click', function() {
  current = 0; score = 0; answered = [];
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
