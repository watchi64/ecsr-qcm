<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Thème 04 : L'autoroute</title>
<style>
  :root {
    --primary:#1a56db;--success:#057a55;--danger:#c81e1e;
    --bg:#f9fafb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  header{text-align:center;margin-bottom:32px;max-width:700px;width:100%;}
  .badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:10px;}
  h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;}
  header p{color:var(--muted);font-size:.95rem;}
  .progress-wrap{max-width:700px;width:100%;margin-bottom:20px;}
  .progress-info{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px;}
  .progress-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 32px;max-width:700px;width:100%;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .question-num{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:10px;}
  .question-text{font-size:1.1rem;font-weight:600;line-height:1.5;margin-bottom:20px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
    border:2px solid var(--border);border-radius:10px;cursor:pointer;
    transition:border-color .15s,background .15s;font-size:.97rem;line-height:1.4;user-select:none;}
  .choice:hover:not(.disabled){border-color:var(--primary);background:#eff6ff;}
  .choice-letter{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg);
    border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.82rem;transition:background .15s,border-color .15s,color .15s;}
  .choice.correct{border-color:var(--success);background:#f0fdf4;}
  .choice.correct .choice-letter{background:var(--success);border-color:var(--success);color:#fff;}
  .choice.wrong{border-color:var(--danger);background:#fef2f2;}
  .choice.wrong .choice-letter{background:var(--danger);border-color:var(--danger);color:#fff;}
  .choice.disabled{cursor:default;}
  .explanation{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:.92rem;
    line-height:1.5;display:none;}
  .explanation.ok{background:#f0fdf4;border-left:4px solid var(--success);color:#065f46;}
  .explanation.ko{background:#fef2f2;border-left:4px solid var(--danger);color:#7f1d1d;}
  .btn-next{margin-top:22px;width:100%;padding:14px;background:var(--primary);color:#fff;
    border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;display:none;
    transition:background .15s;}
  .btn-next:hover{background:#1e40af;}
  #results{display:none;text-align:center;}
  .score-circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;margin:0 auto 24px;font-size:2.2rem;font-weight:800;
    border:8px solid var(--primary);color:var(--primary);}
  .score-circle small{font-size:.85rem;font-weight:500;color:var(--muted);}
  #results h2{font-size:1.4rem;margin-bottom:8px;}
  #results > p{color:var(--muted);margin-bottom:24px;}
  .recap{text-align:left;margin-top:16px;border-top:1px solid var(--border);}
  .recap-item{display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:.88rem;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.ok{background:var(--success);}
  .dot.ko{background:var(--danger);}
  .btn-restart{margin-top:28px;padding:14px 32px;background:var(--primary);color:#fff;
    border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;
    transition:background .15s;}
  .btn-restart:hover{background:#1e40af;}
</style>
</head>
<body>

<header>
  <div class="badge">Formation ECSR</div>
  <h1>Thème 04 — L'autoroute</h1>
  <p>15 questions · Sélectionne une réponse pour valider</p>
</header>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Question 1 / 15</span>
    <span id="score-label">Score : 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="card">
  <div id="quiz">
    <div class="question-num" id="q-num">Question 1</div>
    <div class="question-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
    <div class="explanation" id="explanation"></div>
    <button class="btn-next" id="btn-next" type="button">Question suivante →</button>
  </div>

  <div id="results">
    <div class="score-circle"><span id="r-score"></span><small id="r-pct"></small></div>
    <h2 id="r-mention"></h2>
    <p id="r-desc"></p>
    <div class="recap" id="recap"></div>
    <button class="btn-restart" id="btn-restart" type="button">🔄 Recommencer</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Quelle est la vitesse maximale autorisée sur autoroute par temps sec pour un conducteur ayant le permis depuis plus de 2 ans ?",
    choices: ["110 km/h","120 km/h","130 km/h","150 km/h"],
    answer: 2,
    exp: "La vitesse maximale est de 130 km/h par temps sec pour les conducteurs titulaires du permis depuis plus de 2 ans. Elle est réduite à 110 km/h par temps de pluie ou pour les conducteurs en période probatoire."
  },
  {
    q: "Quelle est la vitesse maximale autorisée sur autoroute par temps de pluie pour un conducteur confirmé ?",
    choices: ["90 km/h","100 km/h","110 km/h","130 km/h"],
    answer: 2,
    exp: "Par temps de pluie ou mauvaise visibilité, la vitesse est limitée à 110 km/h sur autoroute pour un conducteur confirmé (plus de 2 ans de permis)."
  },
  {
    q: "Quelle est la vitesse minimale imposée sur la voie de gauche d'une autoroute (en dehors des encombrements) ?",
    choices: ["50 km/h","70 km/h","80 km/h","100 km/h"],
    answer: 2,
    exp: "La voie de gauche sur autoroute est réservée au dépassement. Une vitesse minimale de 80 km/h y est imposée pour ne pas gêner la circulation. Rouler en permanence à gauche est interdit."
  },
  {
    q: "Lequel de ces usagers a accès à l'autoroute ?",
    choices: ["Un cycliste","Un conducteur de cyclomoteur (50 cm³)","Un conducteur de voiture particulière","Un conducteur de tracteur agricole"],
    answer: 2,
    exp: "L'autoroute est interdite aux piétons, cyclistes, cyclomoteurs, engins agricoles et tout véhicule incapable d'atteindre 80 km/h. Seuls les véhicules motorisés aptes à dépasser 80 km/h y sont autorisés."
  },
  {
    q: "Quelle est la distance de sécurité réglementaire minimale à respecter entre deux véhicules sur autoroute ?",
    choices: ["La distance parcourue en 1 seconde","La distance parcourue en 2 secondes","50 mètres fixes quelle que soit la vitesse","100 mètres fixes quelle que soit la vitesse"],
    answer: 1,
    exp: "La réglementation impose de maintenir une distance équivalente à la distance parcourue en 2 secondes. Sur autoroute, des balises blanches tous les 50 m aident à l'estimer. À 130 km/h, cela représente environ 72 mètres."
  },
  {
    q: "En cas de panne sur autoroute, que doit faire en priorité le conducteur ?",
    choices: ["Rester dans le véhicule et appeler depuis son téléphone portable","Quitter le véhicule par la gauche et marcher sur la voie lente","Mettre son gilet rétro-réfléchissant, quitter le véhicule par la droite, se mettre derrière la glissière et appeler le 15/17/18 ou 112","Allumer ses feux de détresse et attendre dans le véhicule"],
    answer: 2,
    exp: "En cas de panne : mettre le gilet avant de sortir, quitter par la droite, mettre le triangle à 150 m minimum, se placer derrière la glissière de sécurité, appeler les secours via une borne SOS (tous les 2 km) ou le 112. Rester dans le véhicule immobilisé sur la BAU est extrêmement dangereux."
  },
  {
    q: "À quelle fréquence les bornes SOS sont-elles implantées sur autoroute ?",
    choices: ["Tous les 500 mètres","Tous les 1 kilomètre","Tous les 2 kilomètres","Tous les 5 kilomètres"],
    answer: 2,
    exp: "Les bornes d'appel d'urgence (bornes SOS) sont implantées tous les 2 kilomètres sur les autoroutes françaises. Elles mettent directement en relation avec le centre d'intervention et géolocalisent automatiquement l'appelant."
  },
  {
    q: "Un conducteur peut-il faire demi-tour sur une autoroute en cas d'erreur de sortie ?",
    choices: ["Oui, sur la bande d'arrêt d'urgence si personne ne vient","Oui, uniquement aux bretelles de sortie","Non, le demi-tour est strictement interdit sur autoroute","Oui, avec les feux de détresse allumés"],
    answer: 2,
    exp: "Le demi-tour est strictement interdit sur autoroute, de même que la marche arrière. En cas d'erreur, il faut prendre la prochaine sortie et revenir par le réseau secondaire ou l'autoroute dans l'autre sens."
  },
  {
    q: "Sur quelle voie le dépassement est-il autorisé sur autoroute ?",
    choices: ["Par la droite uniquement","Par la gauche uniquement","Par la droite ou la gauche selon la densité de trafic","Le dépassement est libre sur toutes les voies"],
    answer: 1,
    exp: "Le dépassement sur autoroute s'effectue uniquement par la gauche. Dépasser par la droite est interdit. La voie de gauche est une voie de dépassement et non une voie de circulation permanente."
  },
  {
    q: "Quelle est la signalisation caractéristique des panneaux d'autoroute ?",
    choices: ["Fond vert et lettres blanches","Fond bleu et lettres blanches","Fond blanc et lettres noires","Fond rouge et lettres blanches"],
    answer: 1,
    exp: "Les panneaux directionnels d'autoroute ont un fond bleu avec des lettres blanches. Le fond vert correspond aux routes nationales et express, le blanc aux routes ordinaires."
  },
  {
    q: "Un conducteur veut s'insérer sur autoroute via une bretelle d'accès. Qui a la priorité ?",
    choices: ["Le véhicule qui s'insère, car il est sur la voie d'accélération","Les véhicules circulant déjà sur l'autoroute","La priorité est partagée entre les deux","Le véhicule le plus rapide a la priorité"],
    answer: 1,
    exp: "Les véhicules déjà engagés sur l'autoroute sont prioritaires. Le conducteur qui s'insère doit adapter sa vitesse sur la voie d'accélération pour trouver un créneau et s'insérer sans forcer la priorité."
  },
  {
    q: "Que doit faire un conducteur lorsqu'il quitte l'autoroute via une bretelle de sortie ?",
    choices: ["Freiner fortement dès l'entrée de la bretelle pour respecter la limitation","Se placer sur la voie de décélération et adapter progressivement sa vitesse","Enclencher le régulateur de vitesse","Allumer ses feux de détresse pour prévenir les autres conducteurs"],
    answer: 1,
    exp: "Sur la voie de décélération, le conducteur doit réduire progressivement sa vitesse pour atteindre la vitesse adaptée à la sortie. Freiner brutalement sur la voie autoroute est dangereux pour les véhicules suiveurs."
  },
  {
    q: "L'utilisation de la bande d'arrêt d'urgence (BAU) pour circuler est-elle autorisée ?",
    choices: ["Oui, en cas de bouchon pour maintenir le trafic","Oui, si le conducteur est pressé et que la BAU est libre","Non, elle est réservée aux arrêts d'urgence et aux véhicules de secours","Oui, pour les véhicules légers uniquement"],
    answer: 2,
    exp: "La BAU est strictement réservée aux arrêts d'urgence (panne, malaise) et à la circulation des véhicules de secours. Y circuler est interdit et extrêmement dangereux. Exception : certaines autoroutes autorisent la circulation sur BAU en cas de congestion, sur signalisation spécifique."
  },
  {
    q: "Quel feu d'éclairage est obligatoire dans les tunnels autoroutiers ?",
    choices: ["Les feux de route (plein phares)","Les feux de position uniquement","Les feux de croisement","Les feux de brouillard avant"],
    answer: 2,
    exp: "Dans les tunnels, les feux de croisement sont obligatoires, même de jour. Les feux de route sont interdits dans les tunnels car ils éblouissent les autres usagers."
  },
  {
    q: "À quelle vitesse maximale un conducteur en période probatoire (permis de moins de 2 ans) peut-il circuler sur autoroute par temps sec ?",
    choices: ["130 km/h (comme tout le monde)","120 km/h","110 km/h","100 km/h"],
    answer: 2,
    exp: "Les conducteurs en période probatoire sont limités à 110 km/h sur autoroute, même par temps sec (contre 130 km/h pour les conducteurs confirmés). Cette limitation s'applique pendant les 2 premières années de permis."
  }
];

let current = 0, score = 0, answered = [];
const letters = ['A','B','C','D'];

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = 'Question ' + (current + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-label').textContent = 'Question ' + (current + 1) + ' / ' + questions.length;
  document.getElementById('score-label').textContent = 'Score : ' + score;
  document.getElementById('progress-fill').style.width = ((current / questions.length) * 100) + '%';

  const choicesEl = document.getElementById('choices');
  choicesEl.textContent = '';
  q.choices.forEach(function(text, i) {
    const div = document.createElement('div');
    div.className = 'choice';
    const letter = document.createElement('div');
    letter.className = 'choice-letter';
    letter.textContent = letters[i];
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(letter);
    div.appendChild(span);
    div.addEventListener('click', function() { selectAnswer(i); });
    choicesEl.appendChild(div);
  });

  const exp = document.getElementById('explanation');
  exp.style.display = 'none';
  exp.className = 'explanation';
  exp.textContent = '';

  const btn = document.getElementById('btn-next');
  btn.style.display = 'none';
  btn.textContent = current < questions.length - 1 ? 'Question suivante →' : 'Voir les résultats →';
}

function selectAnswer(idx) {
  const q = questions[current];
  const allChoices = document.querySelectorAll('.choice');
  allChoices.forEach(function(c) { c.classList.add('disabled'); c.style.pointerEvents = 'none'; });

  const correct = q.answer === idx;
  if (correct) score++;
  answered.push({ correct: correct, qText: q.q });

  allChoices[q.answer].classList.add('correct');
  if (!correct) allChoices[idx].classList.add('wrong');

  const exp = document.getElementById('explanation');
  exp.className = 'explanation ' + (correct ? 'ok' : 'ko');
  exp.textContent = (correct ? '✅ Bonne réponse ! ' : '❌ Mauvaise réponse. La bonne réponse était ' + letters[q.answer] + '. ' + q.choices[q.answer] + '. ') + q.exp;
  exp.style.display = 'block';

  document.getElementById('score-label').textContent = 'Score : ' + score;
  document.getElementById('btn-next').style.display = 'block';
}

document.getElementById('btn-next').addEventListener('click', function() {
  current++;
  if (current < questions.length) { renderQuestion(); } else { showResults(); }
});

function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = 'Terminé !';
  document.getElementById('score-label').textContent = 'Score : ' + score;
  document.getElementById('quiz').style.display = 'none';

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('r-score').textContent = score + '/' + questions.length;
  document.getElementById('r-pct').textContent = pct + ' %';
  document.getElementById('r-mention').textContent = pct >= 80 ? '🎉 Excellent !' : pct >= 60 ? '👍 Bien !' : '📚 À retravailler';
  document.getElementById('r-desc').textContent = 'Tu as obtenu ' + score + ' bonne' + (score > 1 ? 's' : '') + ' réponse' + (score > 1 ? 's' : '') + ' sur ' + questions.length + ' questions.';

  const recap = document.getElementById('recap');
  recap.textContent = '';
  answered.forEach(function(a, i) {
    const item = document.createElement('div');
    item.className = 'recap-item';
    const dot = document.createElement('div');
    dot.className = 'dot ' + (a.correct ? 'ok' : 'ko');
    const label = document.createElement('span');
    label.textContent = 'Q' + (i + 1) + '. ' + (a.qText.length > 72 ? a.qText.substring(0, 72) + '…' : a.qText);
    item.appendChild(dot);
    item.appendChild(label);
    recap.appendChild(item);
  });

  document.getElementById('results').style.display = 'block';
}

document.getElementById('btn-restart').addEventListener('click', function() {
  current = 0; score = 0; answered = [];
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
